# Authenticated settings for the Flow + Foundry + Kotak Neo + Keycloak package.
#
# Apply this after the emitted docker-compose.yaml and compose-development.yaml (which still limits both
# ports to this machine and adds Flow's health check). It switches Foundry to
# foundry-kotak-secured-profile.yaml, which the guide copies into your Foundry deployment folder: every
# request then needs a Bearer token from the example's Keycloak realm, verified against the realm's key
# that the guide exports to identity/keys/<kid>.pem.
#
# Use it only for a package whose needs include identity-context: Foundry checks its profile against the
# composition at startup, and the secured profile is required exactly when the composition has identity.
#
# Flow needs no override: the composition's identity binding turns its checks on. It verifies each caller's
# Bearer token against the realm's key in its config folder's identity/verification-keys/, and calls Foundry
# with a token exchanged for that caller at Keycloak's token endpoint, read from the same mounted folders.
# The guide attaches the Keycloak container to the package's network as `keycloak` so Flow can reach it.

services:
  foundry:
    environment:
      UNFURL_FOUNDRY_PROFILE: profiles/foundry-kotak-secured-profile.yaml
