# Settings for an exported Flow + Foundry package without an identity provider.
#
# Apply this after the emitted docker-compose.yaml. The emitted file follows the Foundry image's
# layout: read-only deployment folders plus a writable state volume, with the image's default
# secured profile. A composition without identity-context needs a Foundry profile without
# authentication, and Foundry refuses the secured profile for it at startup, so this file selects
# foundry-runtime-profile.yaml, which has no authentication. Both ports are limited to this machine
# for that reason. Flow needs no setting: the composition has no identity, so it runs without
# authentication too. Both print a startup warning saying so.

services:
  flow:
    ports: !override
      - "127.0.0.1:8080:8080"
    # The Foundry image has its own health check, but the Flow image doesn't.
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 24

  foundry:
    ports: !override
      - "127.0.0.1:7979:7979"
    environment:
      UNFURL_FOUNDRY_PROFILE: profiles/foundry-runtime-profile.yaml
    # The profile without authentication keeps its state in .foundry/, which the image creates writable for this volume.
    volumes:
      - foundry-dev-state:/opt/unfurl/foundry/.foundry

volumes:
  foundry-dev-state: {}
