# Development settings for an exported Flow + Foundry package.
#
# Apply this after the emitted docker-compose.yaml. The emitted file follows the Foundry image's
# layout: read-only deployment folders plus a writable state volume, with the image's default
# secured profile. That profile needs JWT verification keys, and Flow doesn't send JWTs yet, so this
# file selects the development profile, which has no authentication. Both ports are limited to this
# machine for that reason.

services:
  flow:
    ports: !override
      - "127.0.0.1:8080:8080"
    # The Foundry image has its own health check, but the Flow image doesn't.
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 24

  foundry:
    ports: !override
      - "127.0.0.1:7979:7979"
    environment:
      UNFURL_FOUNDRY_PROFILE: profiles/foundry-runtime-profile.yaml
    # The development profile keeps its state in .foundry/, which the image creates writable for this volume.
    volumes:
      - foundry-dev-state:/opt/unfurl/foundry/.foundry

volumes:
  foundry-dev-state: {}
