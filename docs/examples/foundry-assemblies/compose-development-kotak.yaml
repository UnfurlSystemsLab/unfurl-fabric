# Settings for the Flow + Foundry + Kotak Neo package without an identity provider
# (needs/flow-foundry-kotak.yaml).
#
# Apply this after the emitted docker-compose.yaml and compose-development.yaml. It changes one thing:
# Foundry uses foundry-kotak-development-profile.yaml, which the guide copies into your Foundry
# deployment folder. That profile is Foundry's profile without authentication plus the bindings that
# admit the Kotak Neo adapter from the emitted foundry-admitted/ folder. Like compose-development.yaml,
# it runs with no authentication, on this machine only. For the package with Keycloak, use
# compose-secured-kotak.yaml instead: Foundry refuses this profile when the composition has identity.

services:
  foundry:
    environment:
      UNFURL_FOUNDRY_PROFILE: profiles/foundry-kotak-development-profile.yaml
