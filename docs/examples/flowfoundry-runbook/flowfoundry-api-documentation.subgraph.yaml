id: flowfoundry-api-documentation
version: "1.0.0"
metadata:
  name: Flowfoundry API Documentation Check Phase
  steps: "18"
  owner: flow
nodes:
  # Step 18 verifies the export can be documented (HLD-api-documentation-artifacts §6); the API catalog
  # component serves the documentation at runtime.
  - id: step-18-documentation-check
    type: ACTION
    uses: function.local
    name: Step 18 Documentation Check
    config:
      functionName: fabric.documentation-check
    input:
      downloadManifestPath: $.workflow.input.artifactPaths.step13
      runtimeBindingPath: $.workflow.input.artifactPaths.step14
      documentationVisibilityPath: $.workflow.input.documentationVisibilityPath
      outputPath: $.workflow.input.artifactPaths.step18

  - id: gate-step-18-documentation-check
    type: ACTION
    uses: tool.result.gate
    dependencies:
      - step-18-documentation-check
    config:
      expectedStatus: PASS
    input:
      result: $.nodes.step-18-documentation-check.output
edges:
  - from: step-18-documentation-check
    to: gate-step-18-documentation-check
