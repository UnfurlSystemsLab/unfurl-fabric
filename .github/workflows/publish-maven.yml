name: Publish Maven Package

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Verify and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: MAVEN_GITHUB_USER
          server-password: MAVEN_GITHUB_TOKEN

      - name: Verify
        env:
          MAVEN_GITHUB_USER: ${{ github.actor }}
          MAVEN_GITHUB_TOKEN: ${{ secrets.CI_REPO_TOKEN != '' && secrets.CI_REPO_TOKEN || secrets.GITHUB_TOKEN }}
        run: mvn --batch-mode --no-transfer-progress --update-snapshots verify

      - name: Deploy to GitHub Packages
        env:
          MAVEN_GITHUB_USER: ${{ github.actor }}
          MAVEN_GITHUB_TOKEN: ${{ secrets.CI_REPO_TOKEN != '' && secrets.CI_REPO_TOKEN || secrets.GITHUB_TOKEN }}
        run: >
          mvn --batch-mode --no-transfer-progress
          -DskipTests
          -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/unfurlsystemslab/unfurl
          deploy
