# Fabric authoring agent — a foundry-substrate AgentDefinition (DAG).
# Run on the neutral EmbeddedAgentRuntime with the customer-configured ModelProvider and the
# client-supplied tools loaded from ../tools/*.jar (by name in allowedToolRefs).
# Field names are camelCase (foundry-substrate codec default). The peer of a flow WorkflowDefinition.
id: fabric-authoring
version: "1.0.0"
metadata:
  promptTemplateRefs: [fabric-authoring]
  boundary: server-side-only
  catalogGrounded: true
defaultModelRef: customer-configured
toolRefs:
  - fabric.catalog-query
  - fabric.needs-emitter
  - fabric.intent-emitter
skillRefs:
  - fabric-authoring@1.0.0
inputSchema:
  type: object
  required: [userMessage, catalog]
  properties:
    userMessage: { type: string }
    conversation: { type: array }
    catalog: { type: array }
phases:
  # 1) Decide clarify vs propose vs gap from the prompt + admitted catalog.
  - id: clarify
    promptTemplateRef: fabric-authoring
    modelRef: customer-configured
    allowedToolRefs: [fabric.catalog-query]
    input:
      userMessage: $.agent.input.userMessage
      catalog: $.agent.input.catalog
    maxToolIterations: 2
  # 2) When proposing, emit the grounded needs spec for the chosen catalog capability.
  - id: propose-needs
    promptTemplateRef: fabric-authoring
    modelRef: customer-configured
    allowedToolRefs: [fabric.catalog-query, fabric.needs-emitter]
    dependencies: [clarify]
    maxToolIterations: 2
  # 3) Emit the Studio intents that realize the needs against the resolved catalog entry.
  - id: propose-composition
    promptTemplateRef: fabric-authoring
    modelRef: customer-configured
    allowedToolRefs: [fabric.intent-emitter]
    dependencies: [propose-needs]
    maxToolIterations: 1
# Conditional edges: clarify routes straight to terminal when more detail is needed; otherwise it
# advances to proposing. (Routing conditions are evaluated by the runtime on phase output.)
edges:
  - from: clarify
    to: propose-needs
  - from: propose-needs
    to: propose-composition
